<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codebase Q&A</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        brand: '#3b82f6',
                        surface: '#18181b',
                        background: '#09090b',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #09090b; color: #f4f4f5; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <nav class="border-b border-zinc-800 bg-surface/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center font-bold text-white">&lt;/&gt;</div>
                <span class="font-semibold text-lg tracking-tight">Codebase Q&A</span>
            </div>
            {% if user %}
                <div class="flex items-center gap-4 text-sm">
                    <span class="text-zinc-400">{{ user }}</span>
                    <a href="/logout" class="text-zinc-400 hover:text-white transition-colors">Logout</a>
                </div>
            {% endif %}
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-12">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
