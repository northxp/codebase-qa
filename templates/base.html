<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codebase Q&A</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['ui-monospace', 'monospace'] },
                    colors: {
                        app: '#0f0f11',
                        surface: '#1c1c1f',
                        border: '#2e2e33',
                        brand: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f0f11; color: #f4f4f5; }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-flex; }
        .htmx-request.htmx-indicator { display: inline-flex; }
        /* Custom scrollbar for chat */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #52525b; }
        
        /* Smooth markdown styling */
        .prose pre { background: #1c1c1f !important; border: 1px solid #2e2e33; border-radius: 12px; padding: 1rem; }
        .prose p { margin-bottom: 1rem; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col font-sans antialiased selection:bg-brand/30">
    <!-- Top Navigation -->
    <nav class="h-16 flex-shrink-0 border-b border-border bg-app/80 backdrop-blur-xl flex items-center justify-between px-6 z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-white rounded-xl flex items-center justify-center shadow-sm">
                <span class="text-black font-bold text-sm tracking-tighter">&lt;/&gt;</span>
            </div>
            <span class="font-semibold text-lg tracking-tight text-white">Codebase</span>
        </div>
        
        {% if user %}
        <!-- User Profile / Actions -->
        <div class="flex items-center gap-4">
            {% if user.role == 'admin' %}
            <a href="/admin" class="text-sm text-zinc-400 hover:text-white transition-colors font-medium">Admin</a>
            {% endif %}
            <div class="h-4 w-px bg-border"></div>
            <span class="text-sm text-zinc-300 font-medium">{{ user.username }}</span>
            <a href="/logout" class="text-sm text-zinc-500 hover:text-zinc-300 transition-colors">Logout</a>
        </div>
        {% endif %}
    </nav>

    <!-- Main Content Area (Fixed to viewport, no page scroll) -->
    <main class="flex-1 overflow-hidden relative">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
