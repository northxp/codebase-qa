{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-20">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-semibold mb-2">Welcome back</h1>
        <p class="text-zinc-400 text-sm">Log in to ask questions about your repos.</p>
    </div>
    <div class="bg-surface border border-zinc-800 rounded-xl p-6 shadow-2xl">
        <form method="POST" action="/auth/login" class="flex flex-col gap-4">
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-background border border-zinc-800 rounded-lg px-4 py-2 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
            </div>
            <div>
                <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
                <input type="password" name="password" required class="w-full bg-background border border-zinc-800 rounded-lg px-4 py-2 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition-all">
            </div>
            <button type="submit" class="bg-brand hover:bg-blue-600 text-white font-medium py-2 rounded-lg mt-2 transition-colors">Log In</button>
        </form>
        <p class="text-center text-sm text-zinc-400 mt-6">Don't have an account? <a href="/signup" class="text-brand hover:underline">Sign up</a></p>
    </div>
</div>
{% endblock %}
