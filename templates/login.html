{% extends "base.html" %}
{% block content %}
<div class="absolute inset-0 flex items-center justify-center bg-app p-4">
    
    <!-- Admin Toggle Button (Top Right) -->
    <button onclick="document.getElementById('user-login').classList.add('hidden'); document.getElementById('admin-login').classList.remove('hidden');" 
            class="absolute top-8 right-8 text-xs font-medium text-zinc-500 hover:text-white transition-colors border border-border px-4 py-2 rounded-lg bg-surface shadow-sm">
        Admin Portal
    </button>

    <!-- User Login -->
    <div id="user-login" class="w-full max-w-sm p-8 bg-surface border border-border rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-brand rounded-full blur-3xl opacity-10"></div>
        
        <div class="text-center mb-8 relative z-10">
            <div class="w-12 h-12 bg-white rounded-xl mx-auto flex items-center justify-center mb-4 shadow-lg">
                <span class="text-black font-bold text-xl tracking-tighter">&lt;/&gt;</span>
            </div>
            <h1 class="text-2xl font-semibold text-white tracking-tight">Welcome back</h1>
        </div>
        
        <form method="POST" action="/auth/login" class="flex flex-col gap-4 relative z-10">
            <input type="text" name="username" placeholder="Username" required class="w-full bg-app border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-500 transition-all placeholder:text-zinc-600">
            <input type="password" name="password" placeholder="Password" required class="w-full bg-app border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-500 transition-all placeholder:text-zinc-600">
            <button type="submit" class="bg-white text-black font-medium py-3 rounded-xl mt-2 hover:bg-zinc-200 transition-colors shadow-sm">Log In</button>
        </form>
        <p class="text-center text-xs text-zinc-500 mt-6 relative z-10">New here? <a href="/signup" class="text-white hover:underline">Create an account</a></p>
    </div>

    <!-- Admin Login (Hidden by default) -->
    <div id="admin-login" class="hidden w-full max-w-sm p-8 bg-surface border border-border rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-4 right-4">
            <span class="px-2 py-1 bg-border text-zinc-400 text-[10px] font-bold uppercase tracking-wider rounded">Admin Only</span>
        </div>
        
        <div class="text-center mb-8 relative z-10 mt-4">
            <h1 class="text-xl font-semibold text-white tracking-tight">Administrator</h1>
            <p class="text-sm text-zinc-500 mt-1">Manage system ingestion.</p>
        </div>
        
        <form method="POST" action="/auth/admin-login" class="flex flex-col gap-4 relative z-10">
            <input type="text" name="username" placeholder="Admin Username" required class="w-full bg-app border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-500 transition-all placeholder:text-zinc-600">
            <input type="password" name="password" placeholder="Admin Password" required class="w-full bg-app border border-border rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-zinc-500 transition-all placeholder:text-zinc-600">
            <button type="submit" class="bg-zinc-800 text-white border border-zinc-700 font-medium py-3 rounded-xl mt-2 hover:bg-zinc-700 transition-colors shadow-sm">Admin Log In</button>
        </form>
        <button onclick="document.getElementById('admin-login').classList.add('hidden'); document.getElementById('user-login').classList.remove('hidden');" 
                class="w-full text-center text-xs text-zinc-500 hover:text-white mt-6 relative z-10 transition-colors">
            &larr; Back to User Login
        </button>
    </div>
</div>
{% endblock %}
