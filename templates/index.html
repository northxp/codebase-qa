{% extends "base.html" %}
{% block content %}
<div class="h-full flex flex-col max-w-4xl mx-auto w-full">
    
    <!-- Scrollable Chat Area -->
    <div id="chat-history" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth flex flex-col">
        <!-- Empty State -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-center opacity-70 mt-[-10vh]">
            <div class="w-16 h-16 bg-surface border border-border rounded-2xl flex items-center justify-center mb-6 shadow-xl">
                <svg class="w-8 h-8 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
            </div>
            <h2 class="text-2xl font-semibold text-white mb-2 tracking-tight">How can I help you today?</h2>
            <p class="text-sm text-zinc-500">Ask a question about the selected repository.</p>
        </div>
    </div>

    <!-- Floating Input Area -->
    <div class="flex-shrink-0 p-4 pb-6 bg-gradient-to-t from-app via-app to-transparent">
        <form id="chat-form" hx-post="/ask-ui" hx-target="#chat-history" hx-swap="beforeend" 
              hx-on::before-request="
                document.getElementById('empty-state').style.display = 'none'; 
                const q = document.querySelector('input[name=question]').value;
                
                // Append User Message
                document.getElementById('chat-history').insertAdjacentHTML('beforeend', `<div class='flex justify-end mb-6'><div class='bg-zinc-800 text-white px-5 py-3 rounded-3xl rounded-tr-sm max-w-[80%] text-[15px] shadow-sm'>${q}</div></div>`); 
                
                // Append Loading Bubble
                document.getElementById('chat-history').insertAdjacentHTML('beforeend', `
                    <div id='active-loading' class='flex gap-4 mb-6'>
                        <div class='w-8 h-8 rounded-full bg-white flex-shrink-0 flex items-center justify-center shadow-sm mt-1'>
                            <span class='text-black font-bold text-xs'>AI</span>
                        </div>
                        <div class='flex items-center gap-2 h-8'>
                            <div class='w-2 h-2 bg-zinc-500 rounded-full animate-bounce'></div>
                            <div class='w-2 h-2 bg-zinc-500 rounded-full animate-bounce' style='animation-delay: 0.1s'></div>
                            <div class='w-2 h-2 bg-zinc-500 rounded-full animate-bounce' style='animation-delay: 0.2s'></div>
                        </div>
                    </div>
                `);

                document.querySelector('input[name=question]').value = ''; 
                document.getElementById('chat-history').scrollTop = document.getElementById('chat-history').scrollHeight;
              "
              hx-on::after-request="
                // Reliably remove loading bubble when request finishes
                const loading = document.getElementById('active-loading');
                if (loading) loading.remove();
              "
              class="max-w-3xl mx-auto relative flex items-center bg-surface border border-border rounded-3xl p-2 shadow-2xl focus-within:border-zinc-500 focus-within:ring-1 focus-within:ring-zinc-500/50 transition-all">
            
            <select id="repo-select" name="repo" class="bg-transparent text-sm font-medium text-zinc-400 hover:text-white focus:outline-none ml-3 mr-2 border-r border-border pr-3 cursor-pointer appearance-none">
                {% for r in repos %}
                    <option value="{{ r }}" class="bg-surface text-white">{{ r }}</option>
                {% endfor %}
            </select>

            <input type="text" name="question" placeholder="Ask anything..." required autocomplete="off"
                   class="flex-1 bg-transparent text-[15px] text-white focus:outline-none placeholder:text-zinc-600 py-2">
            
            <button type="submit" class="w-10 h-10 bg-white text-black rounded-full flex items-center justify-center hover:bg-zinc-200 transition-colors ml-2 flex-shrink-0">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
            </button>
        </form>
    </div>
</div>
{% endblock %}
