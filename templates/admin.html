{% extends "base.html" %}
{% block content %}
<div class="h-full overflow-y-auto p-8">
    <div class="max-w-4xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-semibold text-white tracking-tight">Admin Dashboard</h1>
                <p class="text-zinc-500 text-sm mt-1">Manage repository ingestion.</p>
            </div>
            <a href="/" class="text-sm font-medium text-white bg-surface border border-border px-4 py-2 rounded-xl hover:bg-zinc-800 transition-colors">&larr; Back to Chat</a>
        </div>

        <!-- Ingestion Form -->
        <div class="bg-surface border border-border rounded-2xl p-6 mb-8 shadow-xl">
            <h2 class="text-lg font-medium text-white mb-4">Ingest New Repository</h2>
            
            <form hx-post="/admin/ingest" hx-target="#ingest-status-container" hx-indicator="#ingest-spinner" class="flex flex-col md:flex-row gap-3">
                <input type="text" name="url" placeholder="https://github.com/owner/repo" required class="flex-1 bg-app border border-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-zinc-500 text-white placeholder:text-zinc-600">
                <input type="text" name="sha" placeholder="Commit SHA (optional)" class="w-full md:w-48 bg-app border border-border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-zinc-500 text-white placeholder:text-zinc-600">
                <button type="submit" class="bg-white text-black font-medium px-6 py-2.5 rounded-xl hover:bg-zinc-200 transition-colors flex items-center justify-center gap-2">
                    <span id="ingest-spinner" class="htmx-indicator w-4 h-4 border-2 border-black border-t-transparent rounded-full animate-spin"></span>
                    Ingest
                </button>
            </form>
            
            <!-- Progress rendering area -->
            <div id="ingest-status-container"></div>
        </div>

        <!-- Ingested Repos Table -->
        <div class="bg-surface border border-border rounded-2xl overflow-hidden shadow-xl">
            <table class="w-full text-left text-sm text-zinc-400">
                <thead class="bg-app/50 text-xs uppercase font-medium text-zinc-500 border-b border-border">
                    <tr>
                        <th class="px-6 py-4">Repository</th>
                        <th class="px-6 py-4">Commit SHA</th>
                        <th class="px-6 py-4">Ingested At</th>
                        <th class="px-6 py-4 text-right">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-border/50">
                    {% for r in repos %}
                    <tr id="repo-row-{{ loop.index }}" class="hover:bg-zinc-800/30 transition-colors">
                        <td class="px-6 py-4 font-medium text-white">{{ r[0] }}</td>
                        <td class="px-6 py-4 font-mono text-xs">{{ r[1][:7] }}</td>
                        <td class="px-6 py-4">{{ r[2].strftime('%Y-%m-%d %H:%M') }}</td>
                        <td class="px-6 py-4 text-right">
                            <button hx-post="/admin/delete-repo" 
                                    hx-vals='{"repo_name": "{{ r[0] }}"}' 
                                    hx-target="#repo-row-{{ loop.index }}" 
                                    hx-swap="outerHTML swap:0.5s"
                                    hx-confirm="Are you sure you want to delete this repo and all its embeddings?"
                                    class="text-xs text-red-400 hover:text-red-300 font-medium transition-colors bg-red-400/10 hover:bg-red-400/20 px-3 py-1.5 rounded-lg">
                                Remove
                            </button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
