<div class="bg-surface border border-zinc-800 rounded-xl p-6 shadow-lg animate-[fadeIn_0.3s_ease-out]">
    <div class="flex items-center gap-2 mb-4 text-sm text-brand font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        Answer
    </div>
    
    <div class="prose prose-invert prose-zinc max-w-none text-zinc-300 text-sm leading-relaxed whitespace-pre-wrap">
        {{ answer }}
    </div>

    {% if valid_citations %}
        <div class="mt-6 pt-4 border-t border-zinc-800">
            <div class="text-xs font-semibold text-zinc-500 uppercase tracking-wider mb-2">Verified Citations</div>
            <div class="flex flex-wrap gap-2">
                {% for c in valid_citations %}
                    <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-brand/10 text-brand border border-brand/20 font-mono">
                        {{ c }}
                    </span>
                {% endfor %}
            </div>
        </div>
    {% endif %}
</div>
