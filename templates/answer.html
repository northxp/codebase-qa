<div class="flex gap-4 mb-6 animate-[fadeIn_0.3s_ease-out]">
    <!-- AI Avatar -->
    <div class="w-8 h-8 rounded-full bg-white flex-shrink-0 flex items-center justify-center shadow-sm mt-1">
        <span class="text-black font-bold text-xs">AI</span>
    </div>
    
    <div class="flex-1 min-w-0">
        <script id="raw-answer-{{ loop.index }}" type="application/json">{{ answer | tojson }}</script>
        
        <div id="rendered-answer-{{ loop.index }}" class="prose prose-invert prose-zinc max-w-none text-[15px] leading-relaxed text-zinc-300"></div>
        
        {% if valid_citations %}
            <div class="mt-4 pt-3 border-t border-border/50">
                <div class="flex flex-wrap gap-2">
                    {% for c in valid_citations %}
                        <span class="inline-flex items-center px-2.5 py-1 rounded-md text-[11px] font-mono bg-surface text-zinc-400 border border-border">
                            {{ c }}
                        </span>
                    {% endfor %}
                </div>
            </div>
        {% endif %}
    </div>
</div>

<script>
    (function() {
        const rawText = JSON.parse(document.getElementById('raw-answer-{{ loop.index }}').textContent);
        const target = document.getElementById('rendered-answer-{{ loop.index }}');
        target.innerHTML = marked.parse(rawText);
        target.querySelectorAll('pre code').forEach((block) => { hljs.highlightElement(block); });
        
        const chatBox = document.getElementById('chat-history');
        if (chatBox) chatBox.scrollTop = chatBox.scrollHeight;
    })();
</script>
